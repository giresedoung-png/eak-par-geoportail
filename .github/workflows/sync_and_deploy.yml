name: Synchronisation quotidienne EAK-PAR (Kobo -> InfinityFree)
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Synchroniser les données depuis KoboToolbox
        env:
          KOBO_SERVER: ${{ secrets.KOBO_SERVER }}
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          SYNC_MEDIA: ${{ secrets.SYNC_MEDIA }}
          IMAGE_MAX_DIMENSION: "1280"
          IMAGE_JPEG_QUALITY: "70"
        run: python3 scripts/kobo_sync.py
      - name: Intégrer les données papier historiques (masques + photos NoteCam)
        run: python3 scripts/legacy_import.py
      - name: Calculer le PK par référencement linéaire (si tracé RN17 fourni)
        run: python3 scripts/calcul_pk_lineaire.py
      - name: Générer l'emprise réelle RN17 (levé topographique)
        run: python3 scripts/generer_emprise_geojson.py
      - name: Analyser les PAP en zone tampon de l'emprise
        run: python3 scripts/analyse_emprise.py
      - name: Fusionner Kobo + historique et calculer les statistiques
        run: python3 scripts/merge_sources.py
      - name: Publier le site (pages + données) sur InfinityFree (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ./eakpar.fwh.is/htdocs/
          dangerous-clean-slate: false
          # Les médias sont envoyés séparément (étape suivante). Nom d'état DISTINCT :
          # sans état antérieur, FTP-Deploy ne supprime rien (en particulier aucune
          # des photos déjà présentes sur le serveur).
          state-name: .ftp-deploy-sync-state-site.json
          exclude: |
            media/**
      - name: Envoyer les nouvelles photos/signatures (tolérant aux fichiers verrouillés)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/upload_media_ftp.py
      - name: Enregistrer le checkpoint et l'archive des fiches pour la prochaine exécution
        if: always()
        run: |
          git config user.name "eak-par-bot"
          git config user.email "actions@github.com"
          git add scripts/last_sync.json scripts/archive
          git diff --quiet --cached || git commit -m "chore: mise a jour du checkpoint et de l'archive des fiches [skip ci]"
          git pull --rebase -q origin main || true
          git push
